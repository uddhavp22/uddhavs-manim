# Manim Sideview (VS Code extension) config for this directory only.
#
# Sideview looks for `manim.cfg` in the same directory as the .py file being
# previewed, and spawns manim with that directory as cwd -- not the repo
# root the way render.sh does (see ../../../sideview_manim.sh). Any AP-BIO
# subfolder that gains its own scenes later needs its own copy of this file;
# Sideview does not search parent directories.
#
# Whenever this file exists, Sideview ignores the `manim-sideview.commandLineArgs`
# VS Code setting entirely, so quality has to be set here instead.

[CLI]

# Must match projects/AP-BIO/common/palette.py's BG and the repo-root
# manim.cfg's background_color, so preview renders look identical to
# render.sh output.
background_color = #0C0E12

# Draft quality for fast iteration -- the live-preview equivalent of
# render.sh's -ql. Sideview's own output-path prediction only reads the
# `quality` key from this file, not arbitrary CLI flags, which is the other
# reason this can't just be a commandLineArgs setting instead.
quality = low_quality

# Route output back to the repo-root media/ folder instead of a stray one
# nested under this directory, so preview renders and render.sh renders
# land in the same place. Three levels up: chemistry-concepts -> AP-BIO ->
# projects -> repo root.
media_dir = ../../../media

# One fewer network round trip per live-preview render.
notify_outdated_version = False
