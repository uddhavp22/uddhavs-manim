  - [complex_plane, requires, unit_arrow]
  - [unit_arrow, visualizes, phase]
  - [phase, formalizes, wrapping]
  - [wrapping, visualizes, ecf]
  - [arrow_average, formalizes, ecf]
  - [cancellation, motivates, ecf]
  - [ecf, generalizes, three_panel_rig]
  - [ecf, requires, expectation]
  - [re_im, formalizes, ecf]
  - [symmetry_real, justifies, gaussian_cf_is_real]
  - [phi_at_zero, used_by, gaussian_cf]
  - [aliasing, fails_when, ecf]
  - [aliasing, motivates, integration_range]
  - [low_t_blind, motivates, weighting]
  - [noise_floor, motivates, weighting]
  - [weighting, approximates, integration_range]
  - [histogram_fails, contrasts_with, differentiability]
  - [differentiability, justifies, ecf]
  - [uniqueness, justifies, squared_gap]
  - [sound_analogy, visualizes, uniqueness]
  - [gaussian_cf, used_by, squared_gap]
  - [squared_gap, formalizes, epps_pulley]
  - [uniqueness, proved_using, fourier_transform]
  - [cramer_wold, proved_using, uniqueness]
  - [diagonal_trap, motivates, cramer_wold]
  - [anticollapse, proved_using, cramer_wold]
  - [epps_pulley, used_by, anticollapse]

# --------------------------------------------- where an animation could mislead
false_inference_risks:
  - node: three_panel_rig
    risk: >
      Panel 3 plots Re phi only. The viewer may infer the displayed curve
      determines the distribution. It does not -- Im phi is also needed.
    mitigation: b05 introduces Im phi explicitly before uniqueness is claimed in b09.
    status: mitigated

  - node: ecf
    risk: >
      Sweeping t and watching the average arrow shrink suggests |phi| decreases
      monotonically. It does not -- arrows realign and it comes back up.
    mitigation: >
      b06 (two-point, phi = cos t) shows an oscillating curve, and b06a shows
      |phi(3.0)| returning to exactly 1.0000 on an aliased batch.
    status: mitigated

  - node: weighting
    risk: >
      Presenting [0.2, 4] as "the weighting" implies the weight is a hard window.
      It is a smooth Gaussian; the range is a truncation.
    mitigation: b08 narration corrected 2026-08-06; both objects now named.
    status: mitigated

  - node: epps_pulley
    risk: >
      Showing a formula containing w_lambda(t) over an animation that never
      constructed it implies the picture computed the displayed quantity.
    mitigation: b12 now builds the formula in two steps, unweighted first.
    status: mitigated

  - node: anticollapse
    risk: >
      Watching gradient descent open a collapsed cloud implies convergence is
      guaranteed. The source explicitly guarantees the GLOBAL MINIMUM ONLY.
    mitigation: not yet built -- Chapter C.9 must state this out loud.
    status: OPEN
    severity: high
