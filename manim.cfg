# Project-wide Manim Community settings.
#
# Manim reads this from the *current working directory*, which is why render.sh
# and build.sh always cd to the repo root before invoking the CLI. Running the
# CLI from anywhere else silently loses everything below -- wrong background,
# wrong frame rate, unresolvable sound files.
#
# Anything not set here falls back to manim/_config/default.cfg.

[CLI]

# --- camera ----------------------------------------------------------------
# Upstream default is BLACK. Pure black was tried and crushed: panel furniture
# at GRID vanished entirely at 480p. This is a near-black with a slight cool
# cast -- rich on an OLED phone, but leaves the axes somewhere to sit. Must
# match common/palette.py BG.
background_color = #0C0E12

# Delivery format. The -q flags override both of these: -ql is 854x480 at 15
# fps for drafts, -qh is what these values describe.
pixel_width = 1920
pixel_height = 1080
frame_rate = 60

# --- paths -----------------------------------------------------------------
# Everything manim generates lives under media/, which is gitignored whole.
media_dir = ./media

# Sound files named in `add_background_music("music/bed.mp3")` are resolved
# against assets_dir, so point it at the tracks rather than at the repo root.
assets_dir = ./sounds

# --- output ----------------------------------------------------------------
# Renders are the point, so writing is on and previewing is not: a preview
# window opening on every scene of a chapter build is unusable.
write_to_movie = True
preview = False

# Chapter builds render eleven scenes in a row; INFO puts a wall of per-scene
# banner between them. render.sh passes -v INFO back when you want it.
verbosity = WARNING
progress_bar = display

# Manim checks PyPI for a newer release on every single invocation. That is one
# network round trip per scene in a chapter build, and it has nothing to say
# here: the engine is pinned to the local ../manim-ce checkout.
notify_outdated_version = False
